<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS MDX PAIRING</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg-0:#1a0000;
    --bg-1:#2b0202;
    --red-1:#8f0e0e;
    --red-2:#c1121f;
    --red-3:#ff2e2e;
    --ink:#ffe9e9;
    --ink-dim:#ffb3b3;
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, var(--red-1) 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, var(--red-2) 0%, transparent 40%),
      var(--bg-0);
    color:var(--ink);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }

  .brand{
    text-align:center;
    margin-bottom:28px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;height:64px;
    border-radius:16px;
    background:linear-gradient(145deg,var(--red-3),var(--red-1));
    font-weight:800;
    font-size:22px;
    letter-spacing:1px;
    box-shadow:0 10px 30px rgba(255,46,46,0.35);
    margin-bottom:14px;
  }
  h1{
    font-size:26px;
    letter-spacing:0.5px;
    font-weight:700;
    text-shadow:0 0 18px rgba(255,46,46,0.45);
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:13px;
    margin-top:6px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.15));
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
    backdrop-filter:blur(6px);
  }

  .owner-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .owner-row:last-child{border-bottom:none;}
  .owner-label{
    font-size:12px;
    color:var(--ink-dim);
  }
  .owner-value{
    font-size:15px;
    font-weight:600;
    text-align:right;
  }

  .pair-box{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  input[type="text"]{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.35);
    color:var(--ink);
    font-size:15px;
    outline:none;
  }
  input[type="text"]:focus{
    border-color:var(--red-3);
    box-shadow:0 0 0 3px rgba(255,46,46,0.2);
  }
  button{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--red-3),var(--red-1));
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(255,46,46,0.35);
  }
  button:active{transform:translateY(0);}

  .code-display{
    font-family:"Courier New",monospace;
    font-size:28px;
    letter-spacing:6px;
    text-align:center;
    color:var(--red-3);
    padding:14px 0;
    min-height:44px;
  }

  .section-title{
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:rgba(0,0,0,0.3);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
  }
  .stat .num{
    font-size:18px;
    font-weight:800;
    color:var(--red-3);
  }
  .stat .lbl{
    font-size:10px;
    color:var(--ink-dim);
    margin-top:4px;
  }

  canvas{max-width:100%;}

  footer{
    color:var(--ink-dim);
    font-size:11px;
    text-align:center;
    margin-top:10px;
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="mark">MDX</div>
    <h1>NEXUS MDX PAIRING</h1>
    <div class="subtitle">Session de pairing WhatsApp</div>
  </div>

  <div class="card">
    <div class="owner-row">
      <span class="owner-label">Owner</span>
      <span class="owner-value">PRINCE PREMIUM</span>
    </div>
    <div class="owner-row">
      <span class="owner-label">Numéro</span>
      <span class="owner-value">+243 860 885 022</span>
    </div>
    <div class="owner-row">
      <span class="owner-label">Statut</span>
      <span class="owner-value" style="color:var(--red-3);">● En ligne</span>
    </div>
  </div>

  <div class="card pair-box">
    <div class="section-title"><span>Pairing code</span></div>
    <input type="text" id="phoneInput" placeholder="Entrer le numéro (ex: 243...)" />
    <button id="pairBtn">Générer le code</button>
    <div class="code-display" id="codeOutput">— — — — — —</div>
  </div>

  <div class="card">
    <div class="section-title"><span>Statistiques</span></div>
    <div class="stat-grid">
      <div class="stat">
        <div class="num" id="statUsers">0</div>
        <div class="lbl">Utilisateurs</div>
      </div>
      <div class="stat">
        <div class="num" id="statUptime">0%</div>
        <div class="lbl">Uptime</div>
      </div>
      <div class="stat">
        <div class="num" id="statCmds">0</div>
        <div class="lbl">Commandes</div>
      </div>
    </div>
    <canvas id="activityChart" height="180"></canvas>
  </div>

  <footer>NEXUS MDX &middot; propulsé par Baileys &middot; hébergé sur Railway</footer>

<script>
  // Génération d'un faux code de pairing (à remplacer par un appel API réel si disponible)
  document.getElementById('pairBtn').addEventListener('click', function () {
    const phone = document.getElementById('phoneInput').value.trim();
    const output = document.getElementById('codeOutput');
    if (!phone) {
      output.textContent = 'Entrez un numéro';
      output.style.color = 'var(--ink-dim)';
      return;
    }
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    output.textContent = code;
    output.style.color = 'var(--red-3)';
  });

  // Animation des compteurs de stats (valeurs d'exemple)
  function animateCount(id, target, suffix) {
    const el = document.getElementById(id);
    let current = 0;
    const step = Math.max(1, Math.ceil(target / 40));
    const timer = setInterval(() => {
      current += step;
      if (current >= target) {
        current = target;
        clearInterval(timer);
      }
      el.textContent = current + (suffix || '');
    }, 30);
  }
  animateCount('statUsers', 128);
  animateCount('statUptime', 99, '%');
  animateCount('statCmds', 47);

  // Graphique d'activité (données d'exemple)
  const ctx = document.getElementById('activityChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],
      datasets: [{
        label: 'Messages traités',
        data: [40, 65, 52, 88, 74, 96, 81],
        borderColor: '#ff2e2e',
        backgroundColor: 'rgba(255,46,46,0.15)',
        fill: true,
        tension: 0.35,
        pointBackgroundColor: '#ff2e2e',
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#ffe9e9' } }
      },
      scales: {
        x: { ticks: { color: '#ffb3b3' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#ffb3b3' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
</script>

</body>
</html>
